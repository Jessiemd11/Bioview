[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bioview"
# Based on BioView 0.9.2 by Aakash Kapoor (GPL-v3); ".post1" marks this modified build
version = "0.9.2.post1"
description = "A versatile, extensible, and performant cross-platform app for biomedical and human-computer interface instrumentation control"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Aakash Kapoor", email = "113218196+meowkash@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "darkdetect (>=0.8.0,<0.9.0)",
    "h5py (>=3.13.0,<4.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "numpy (<2.0.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "pyqt6 (>=6.9.0,<7.0.0)",
    "pyqtgraph (>=0.13.7,<0.14.0)",
    "qtawesome (>=1.4.0,<2.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "uhd (==4.8.0.0) ; sys_platform == 'win32'",
]

[tool.poetry]
packages = [{ include = "bioview" }]
